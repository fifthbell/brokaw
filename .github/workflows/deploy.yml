name: Deploy Storybook

on:
  push:
    branches:
      - main
    paths:
      - 'brokaw/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: brokaw
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        working-directory: brokaw
        run: pnpm build-storybook

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        working-directory: brokaw
        run: |
          aws s3 rm s3://${{ vars.BROKAW_BUCKET_NAME }} --recursive
          aws s3 sync storybook-static/ s3://${{ vars.BROKAW_BUCKET_NAME }}

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.BROKAW_DISTRIBUTION_ID }} --paths "/*"

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Project**: Brokaw Storybook" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: ${{ vars.BROKAW_BUCKET_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Distribution**: ${{ vars.BROKAW_DISTRIBUTION_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Deployed" >> $GITHUB_STEP_SUMMARY
